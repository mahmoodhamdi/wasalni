version: '3.8'

# Development Docker Compose - Uses local services only
services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: wasalni-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: wasalni
      MONGO_INITDB_ROOT_PASSWORD: wasalni123
      MONGO_INITDB_DATABASE: wasalni
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - wasalni-dev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wasalni-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - wasalni-dev-network

  # Mongo Express - MongoDB Admin UI
  mongo-express:
    image: mongo-express
    container_name: wasalni-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: wasalni
      ME_CONFIG_MONGODB_ADMINPASSWORD: wasalni123
      ME_CONFIG_MONGODB_URL: mongodb://wasalni:wasalni123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - wasalni-dev-network

  # Redis Commander - Redis Admin UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: wasalni-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - wasalni-dev-network

volumes:
  mongodb_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  wasalni-dev-network:
    driver: bridge
