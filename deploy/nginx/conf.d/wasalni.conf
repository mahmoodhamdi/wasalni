## Wasalni — multi-host reverse proxy
##
## Three hosts, one nginx:
##   wasalni.app           → passenger PWA  (port 3100)
##   driver.wasalni.app    → driver PWA     (port 3200)
##   admin.wasalni.app     → admin dashboard (default Next port 3000 in
##                                            its container)
##   api.wasalni.app       → backend REST + Socket.io (port 3000 inside
##                                            the backend container)
##
## TLS termination: set up Let's Encrypt with certbot externally and
## drop the certs into deploy/nginx/certs/. For local dev/staging,
## comment out the TLS server blocks and uncomment the plain :80.

upstream passenger_app {
  server passenger-web:3100;
  keepalive 16;
}
upstream driver_app {
  server driver-web:3200;
  keepalive 16;
}
upstream admin_app {
  server admin-dashboard:3000;
  keepalive 16;
}
upstream backend_api {
  server backend:3000;
  keepalive 16;
}

# Common settings injected into every server block.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # ACME challenge if you wire certbot here.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect everything else to HTTPS once TLS is set up.
  # location / { return 301 https://$host$request_uri; }
  location / { proxy_pass http://passenger_app; include /etc/nginx/conf.d/_proxy.inc; }
}

# Passenger (wasalni.app)
server {
  listen 80;
  server_name wasalni.app www.wasalni.app;
  location / { proxy_pass http://passenger_app; include /etc/nginx/conf.d/_proxy.inc; }
}

# Driver (driver.wasalni.app)
server {
  listen 80;
  server_name driver.wasalni.app;
  location / { proxy_pass http://driver_app; include /etc/nginx/conf.d/_proxy.inc; }
}

# Admin (admin.wasalni.app)
server {
  listen 80;
  server_name admin.wasalni.app;
  location / { proxy_pass http://admin_app; include /etc/nginx/conf.d/_proxy.inc; }
}

# Backend API (api.wasalni.app) — Socket.io needs upgrade headers.
server {
  listen 80;
  server_name api.wasalni.app;

  location /socket.io/ {
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  location / { proxy_pass http://backend_api; include /etc/nginx/conf.d/_proxy.inc; }
}
